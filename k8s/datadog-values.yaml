# Datadog Helm values for EKS Fargate.
#
# No node DaemonSet (Fargate can't run one). Instead the Cluster Agent's
# admission controller injects an Agent *sidecar* into every pod labeled
# `agent.datadoghq.com/sidecar: fargate` (see k8s/job.yaml). The app's ddtrace
# traces + LLM Obs payloads go to that sidecar over localhost:8126 — the same
# agent path the VM uses.
#
#   helm repo add datadog https://helm.datadoghq.com && helm repo update
#   helm install datadog-agent datadog/datadog -n datadog -f k8s/datadog-values.yaml
datadog:
  apiKeyExistingSecret: datadog-secret   # created out-of-band (key: api-key)
  clusterName: tradingagents
  site: datadoghq.com

# Fargate has no nodes to run a DaemonSet on.
agents:
  enabled: false

clusterAgent:
  enabled: true
  admissionController:
    enabled: true
    agentSidecarInjection:
      enabled: true
      provider: fargate
      # Turn on APM in the injected sidecar so it accepts the app's traces
      # (and forwards LLM Obs via the agent EVP proxy).
      profiles:
        - env:
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "true"
